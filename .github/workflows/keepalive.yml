# Manual diagnostics only. Free services share 750 instance hours/month.
# Continuous health pings exhausted the allowance in September 2026.
name: Check Render health (manual only)

on:
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 60 https://stock-insight-zws6.onrender.com/api/health \
            && echo "awake" || echo "ping failed (server may be waking)"
