# 야간 perp 갭이 크게 벌어지면 텔레그램으로 알린다.
# KRX 장 마감 후~개장 전(KST 16:00~08:30)에만 의미가 있으므로 그 시간대만 돈다.
#
# 필요한 Secrets (Settings → Secrets and variables → Actions):
#   TELEGRAM_BOT_TOKEN  @BotFather로 봇 생성 시 받는 토큰
#   TELEGRAM_CHAT_ID    봇에게 아무 말이나 건 뒤
#                       https://api.telegram.org/bot<토큰>/getUpdates 에서 확인
# 없으면 전송 없이 로그만 남는다(드라이런).
name: Night gap alert

on:
  schedule:
    # KST 16:00–08:30 = UTC 07:00–23:30 → 30분마다
    - cron: '0,30 7-23 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch: {}

# 동시에 겹쳐 돌면 상태 파일이 꼬인다
concurrency:
  group: night-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 실행마다 초기화되므로 중복 알림 방지용 상태를 캐시로 넘긴다.
      # 키에 run_id를 붙여 매번 새로 저장하고, restore-keys로 직전 것을 복원한다.
      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: backend/alert_state.json
          key: night-alert-state-${{ github.run_id }}
          restore-keys: night-alert-state-

      - name: Check night gap
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_THRESHOLD: '3.0'
          ALERT_STEP: '1.5'
        working-directory: backend
        run: python alert_night_gap.py
